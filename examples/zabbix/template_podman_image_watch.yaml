# SPDX-License-Identifier: GPL-3.0-or-later
zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: e780f4469bb64709849d3a8559efabd1
    name: Templates/Applications
  templates:
  - uuid: a2b9405d9eeb41088e6f51b7a3ecfece
    template: Podman Image Watch by Zabbix agent
    name: Podman Image Watch by Zabbix agent
    description: Read-only Quadlet image updates from an atomic JSON report. GPL-3.0-or-later.
    groups:
    - name: Templates/Applications
    macros:
    - macro: '{$PIW.REPORT_PATH}'
      value: /var/lib/podman-image-watch/report.json
    - macro: '{$PIW.MAX_AGE}'
      value: '172800'
      description: Maximum report age in seconds.
    items:
    - uuid: 0fdc293b0c6d4d8f87c76f93872990f2
      name: 'Image Watch: JSON report'
      key: vfs.file.contents["{$PIW.REPORT_PATH}"]
      delay: 5m
      history: '0'
      value_type: TEXT
      trends: '0'
    - uuid: 19bce59999084535b1ee9409975337e6
      name: 'Image Watch: Last scan timestamp'
      type: DEPENDENT
      key: piw.timestamp
      delay: '0'
      history: 7d
      value_type: UNSIGNED
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.scan.timestamp
      master_item:
        key: vfs.file.contents["{$PIW.REPORT_PATH}"]
      units: unixtime
    - uuid: 189c0994f4274aa8ba69c64652152dad
      name: 'Image Watch: Last successful scan timestamp'
      type: DEPENDENT
      key: piw.last_success
      delay: '0'
      history: 7d
      value_type: UNSIGNED
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.scan.last_success_timestamp
      master_item:
        key: vfs.file.contents["{$PIW.REPORT_PATH}"]
      units: unixtime
    - uuid: 99d75c1c1ddd40e59a6071694a2ceda1
      name: 'Image Watch: Scan health'
      type: DEPENDENT
      key: piw.health
      delay: '0'
      history: 7d
      value_type: UNSIGNED
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.scan.health
      master_item:
        key: vfs.file.contents["{$PIW.REPORT_PATH}"]
    - uuid: 0040d89d3eea4c7b81a7875f48592766
      name: 'Image Watch: Total services'
      type: DEPENDENT
      key: piw.total
      delay: '0'
      history: 7d
      value_type: UNSIGNED
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.summary.total_services
      master_item:
        key: vfs.file.contents["{$PIW.REPORT_PATH}"]
    - uuid: 66264befe92141bbb58edb8bea045ae5
      name: 'Image Watch: Services requiring attention'
      type: DEPENDENT
      key: piw.attention
      delay: '0'
      history: 7d
      value_type: UNSIGNED
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.summary.attention_services
      master_item:
        key: vfs.file.contents["{$PIW.REPORT_PATH}"]
    - uuid: f94b37017dbd4e2ea10a2aa86baf924c
      name: 'Image Watch: Services requiring planning'
      type: DEPENDENT
      key: piw.planning
      delay: '0'
      history: 7d
      value_type: UNSIGNED
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.summary.planning_services
      master_item:
        key: vfs.file.contents["{$PIW.REPORT_PATH}"]
    - uuid: 393bc68b4e054c62b435dcf43beac5e7
      name: 'Image Watch: Services with major updates'
      type: DEPENDENT
      key: piw.major
      delay: '0'
      history: 7d
      value_type: UNSIGNED
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.summary.major_updates
      master_item:
        key: vfs.file.contents["{$PIW.REPORT_PATH}"]
    - uuid: adf0293d75df412db77090575539c754
      name: 'Image Watch: Scan errors'
      type: DEPENDENT
      key: piw.errors
      delay: '0'
      history: 7d
      value_type: UNSIGNED
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.summary.errors
      master_item:
        key: vfs.file.contents["{$PIW.REPORT_PATH}"]
    - uuid: 50ccd61cc7524504b183970a2fa5e1ce
      name: 'Image Watch: Unknown results'
      type: DEPENDENT
      key: piw.unknown
      delay: '0'
      history: 7d
      value_type: UNSIGNED
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.summary.unknown
      master_item:
        key: vfs.file.contents["{$PIW.REPORT_PATH}"]
    discovery_rules:
    - uuid: 8b387ff0609440cfb29c5ec7daae4164
      name: 'Image Watch: service discovery'
      type: DEPENDENT
      key: piw.discovery
      delay: '0'
      lifetime: 30d
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.services
      master_item:
        key: vfs.file.contents["{$PIW.REPORT_PATH}"]
      lld_macro_paths:
      - lld_macro: '{#PIW.ID}'
        path: $.id
      - lld_macro: '{#PIW.NAME}'
        path: $.display_name
      item_prototypes:
      - uuid: 504e4fbc94c14fbabd3466f61a5a3c19
        name: '{#PIW.NAME}: service data'
        type: DEPENDENT
        key: piw.service["{#PIW.ID}"]
        delay: '0'
        history: '0'
        value_type: TEXT
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.services[?(@.id == "{#PIW.ID}")].first()
        - type: JAVASCRIPT
          parameters:
          - 'return value === ''null'' ? ''-'' : value;'
        master_item:
          key: vfs.file.contents["{$PIW.REPORT_PATH}"]
        trends: '0'
      - uuid: b15699f0a1d9487ba8a85dc65b89c36b
        name: '{#PIW.NAME}: Current version'
        type: DEPENDENT
        key: piw.service.current["{#PIW.ID}"]
        delay: '0'
        history: 7d
        value_type: CHAR
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.current_version
        - type: JAVASCRIPT
          parameters:
          - 'return value === ''null'' ? ''-'' : value;'
        master_item:
          key: piw.service["{#PIW.ID}"]
        trends: '0'
      - uuid: 4d2383f365dc4ab79fb04f42cb4b8115
        name: '{#PIW.NAME}: Configured digest'
        type: DEPENDENT
        key: piw.service.digest["{#PIW.ID}"]
        delay: '0'
        history: 7d
        value_type: CHAR
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.configured_digest
        - type: JAVASCRIPT
          parameters:
          - 'return value === ''null'' ? ''-'' : value;'
        master_item:
          key: piw.service["{#PIW.ID}"]
        trends: '0'
      - uuid: eeedeae4a23a4a829b97fe612ca7839c
        name: '{#PIW.NAME}: Latest patch'
        type: DEPENDENT
        key: piw.service.patch["{#PIW.ID}"]
        delay: '0'
        history: 7d
        value_type: CHAR
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.updates.patch
        - type: JAVASCRIPT
          parameters:
          - 'return value === ''null'' ? ''-'' : value;'
        master_item:
          key: piw.service["{#PIW.ID}"]
        trends: '0'
      - uuid: 36a9ab464e904ada811eee9c9218e59d
        name: '{#PIW.NAME}: Latest minor'
        type: DEPENDENT
        key: piw.service.minor["{#PIW.ID}"]
        delay: '0'
        history: 7d
        value_type: CHAR
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.updates.minor
        - type: JAVASCRIPT
          parameters:
          - 'return value === ''null'' ? ''-'' : value;'
        master_item:
          key: piw.service["{#PIW.ID}"]
        trends: '0'
      - uuid: 2eadfdeb6fa74da9a5e185bc45f345e0
        name: '{#PIW.NAME}: Latest major'
        type: DEPENDENT
        key: piw.service.major["{#PIW.ID}"]
        delay: '0'
        history: 7d
        value_type: CHAR
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.updates.major
        - type: JAVASCRIPT
          parameters:
          - 'return value === ''null'' ? ''-'' : value;'
        master_item:
          key: piw.service["{#PIW.ID}"]
        trends: '0'
      - uuid: 615871f5d5b04f0a891451fcbede1475
        name: '{#PIW.NAME}: Update availability'
        type: DEPENDENT
        key: piw.service.update_status["{#PIW.ID}"]
        delay: '0'
        history: 7d
        value_type: CHAR
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.update_status
        - type: JAVASCRIPT
          parameters:
          - 'return value === ''null'' ? ''-'' : value;'
        master_item:
          key: piw.service["{#PIW.ID}"]
        trends: '0'
      - uuid: 4051de85ee34433b9bb1b4353d2f16f6
        name: '{#PIW.NAME}: Operational priority'
        type: DEPENDENT
        key: piw.service.priority["{#PIW.ID}"]
        delay: '0'
        history: 7d
        value_type: CHAR
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.priority
        - type: JAVASCRIPT
          parameters:
          - 'return value === ''null'' ? ''-'' : value;'
        master_item:
          key: piw.service["{#PIW.ID}"]
        trends: '0'
      - uuid: 4320e9e8b8e94018b91afee7ff60a3ce
        name: '{#PIW.NAME}: Registry check status'
        type: DEPENDENT
        key: piw.service.check_status["{#PIW.ID}"]
        delay: '0'
        history: 7d
        value_type: CHAR
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.check_status
        - type: JAVASCRIPT
          parameters:
          - 'return value === ''null'' ? ''-'' : value;'
        master_item:
          key: piw.service["{#PIW.ID}"]
        trends: '0'
      - uuid: d6d95d7367a04a7485a26f57dba81fec
        name: '{#PIW.NAME}: Acknowledged'
        type: DEPENDENT
        key: piw.service.acknowledged["{#PIW.ID}"]
        delay: '0'
        history: 7d
        value_type: UNSIGNED
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.acknowledged
        - type: BOOL_TO_DECIMAL
          parameters:
          - ''
        master_item:
          key: piw.service["{#PIW.ID}"]
      - uuid: 71832a28cc4048089bc329262a82536a
        name: '{#PIW.NAME}: Snoozed'
        type: DEPENDENT
        key: piw.service.snoozed["{#PIW.ID}"]
        delay: '0'
        history: 7d
        value_type: UNSIGNED
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.snoozed
        - type: BOOL_TO_DECIMAL
          parameters:
          - ''
        master_item:
          key: piw.service["{#PIW.ID}"]
      - uuid: 08513a0407b145a58e1bad0597677ba6
        name: '{#PIW.NAME}: Maintenance attention'
        type: DEPENDENT
        key: piw.service.attention["{#PIW.ID}"]
        delay: '0'
        history: 7d
        value_type: UNSIGNED
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.metrics.attention
        master_item:
          key: piw.service["{#PIW.ID}"]
      - uuid: 860a9fc05f03459abe805dd0ec517a3b
        name: '{#PIW.NAME}: Major update planning'
        type: DEPENDENT
        key: piw.service.planning["{#PIW.ID}"]
        delay: '0'
        history: 7d
        value_type: UNSIGNED
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.metrics.planning
        master_item:
          key: piw.service["{#PIW.ID}"]
      - uuid: 3738c4c939ba4904946436deee22d780
        name: '{#PIW.NAME}: Registry errors'
        type: DEPENDENT
        key: piw.service.errors["{#PIW.ID}"]
        delay: '0'
        history: 7d
        value_type: UNSIGNED
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.metrics.errors
        master_item:
          key: piw.service["{#PIW.ID}"]
      - uuid: 26f098c867bc4e2d8cc34cb3b22dc926
        name: '{#PIW.NAME}: Unsupported or unknown'
        type: DEPENDENT
        key: piw.service.unknown["{#PIW.ID}"]
        delay: '0'
        history: 7d
        value_type: UNSIGNED
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.metrics.unknown
        master_item:
          key: piw.service["{#PIW.ID}"]
      - uuid: 5714ed271429471b9e6223730a16b661
        name: '{#PIW.NAME}: Digest changed'
        type: DEPENDENT
        key: piw.service.digest_changed["{#PIW.ID}"]
        delay: '0'
        history: 7d
        value_type: UNSIGNED
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.metrics.digest_attention
        master_item:
          key: piw.service["{#PIW.ID}"]
      trigger_prototypes:
      - uuid: 2572577b107d4d85a8a81ca9cefeca1c
        name: '{#PIW.NAME}: Maintenance attention'
        expression: last(/Podman Image Watch by Zabbix agent/piw.service.attention["{#PIW.ID}"])=1
        priority: WARNING
        tags:
        - tag: component
          value: image-watch
      - uuid: 640955b0741441ba991114476022b32a
        name: '{#PIW.NAME}: Major update planning'
        expression: last(/Podman Image Watch by Zabbix agent/piw.service.planning["{#PIW.ID}"])=1
        priority: INFO
        tags:
        - tag: component
          value: image-watch
      - uuid: 7386066fbe1743bc9fb3f5266a2cb31b
        name: '{#PIW.NAME}: Registry errors'
        expression: min(/Podman Image Watch by Zabbix agent/piw.service.errors["{#PIW.ID}"],#3)=1
        priority: WARNING
        tags:
        - tag: component
          value: image-watch
      - uuid: 839add320b66464e8ddc8b6b4f6b2d88
        name: '{#PIW.NAME}: Unsupported or unknown'
        expression: last(/Podman Image Watch by Zabbix agent/piw.service.unknown["{#PIW.ID}"])=1
        priority: INFO
        tags:
        - tag: component
          value: image-watch
      - uuid: abf1b311544948f5882b909e500abb8b
        name: '{#PIW.NAME}: Digest changed'
        expression: last(/Podman Image Watch by Zabbix agent/piw.service.digest_changed["{#PIW.ID}"])=1
        priority: INFO
        tags:
        - tag: component
          value: image-watch
  triggers:
  - uuid: a9aba0ded3a74de9b1e48732deaeedcb
    name: 'Image Watch: report is stale'
    expression: now()-last(/Podman Image Watch by Zabbix agent/piw.timestamp)>{$PIW.MAX_AGE}
    priority: WARNING
    tags:
    - tag: component
      value: image-watch
  - uuid: 5114601dd92647f39e88b7ed3c71a97d
    name: 'Image Watch: report cannot be read'
    expression: nodata(/Podman Image Watch by Zabbix agent/vfs.file.contents["{$PIW.REPORT_PATH}"],15m)=1
    priority: WARNING
    tags:
    - tag: component
      value: image-watch
  - uuid: f32412fcd87a4a269eebc93d9b894b2b
    name: 'Image Watch: scans repeatedly fail'
    expression: min(/Podman Image Watch by Zabbix agent/piw.health,#3)=1
    priority: WARNING
    tags:
    - tag: component
      value: image-watch
