# SPDX-License-Identifier: GPL-3.0-or-later
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "podman-image-watch"
version = "1.0.0"
description = "Read-only OCI image update checks for Podman Quadlets"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["PyYAML>=6.0.2,<7", "httpx>=0.27,<1", "packaging>=24,<27"]
classifiers = ["Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9", "mypy>=1.14", "types-PyYAML", "build", "twine", "jsonschema>=4", "jsonpath-ng>=1.7"]

[project.scripts]
podman-image-watch = "podman_image_watch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
